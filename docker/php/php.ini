; Booking calendar — shared PHP settings for FPM and CLI.
; Loaded as $PHP_INI_DIR/conf.d/zz-app.ini (the dev stage layers zzz-dev.ini on top).

[PHP]
expose_php = 0
memory_limit = 256M

upload_max_filesize = 16M
post_max_size = 16M
max_execution_time = 30
max_input_vars = 2000

error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
html_errors = Off
zend.assertions = -1
zend.detect_unicode = 0

; Symfony resolves a lot of paths; keep the realpath cache large and warm.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Date]
date.timezone = UTC

[Session]
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.gc_maxlifetime = 86400

; UTF-8 everywhere (mbstring.internal_encoding is deprecated; default_charset drives it).
default_charset = UTF-8
