; PHP overrides for the single-container `render` image stage.
; Installed as $PHP_INI_DIR/conf.d/zzz-render.ini so it loads AFTER zz-app.ini
; and zz-opcache.ini and wins.
;
; See docker/php/render-fpm.conf for the memory budget this is part of. The
; short version: Render's Free plan gives the whole container 512 MB, and the
; shared opcache.ini reserves 256 MB of it (plus a 64 MB JIT buffer carved out
; of that) before a single request arrives.

; 64 MB is ample for this codebase: the framework plus a few dozen classes and
; templates. Check the real figure with opcache_get_status()['memory_usage']
; if you ever add a large dependency.
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.jit_buffer_size = 16M

; Also applies to the bin/console invocations the entrypoint makes
; (cache:warmup, doctrine:migrations:migrate), which the pool value does not.
memory_limit = 128M
