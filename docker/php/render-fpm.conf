; php-fpm pool overrides for the single-container `render` image stage.
; Installed as /usr/local/etc/php-fpm.d/zzz-render.conf so it loads AFTER
; zz-www.conf and wins.
;
; Render's Free compute plan is 0.1 CPU / 512 MB RAM for the WHOLE container -
; nginx, supervisord and php-fpm together. docker/php/www.conf is sized for a
; developer machine (pm.max_children = 20 at memory_limit 256M), which on
; 512 MB total gets the container OOM-killed under the mildest concurrency.
; The symptom is intermittent 502s that look like an application bug.
[www]
; `ondemand` rather than `dynamic`: with 0.1 CPU there is no benefit to holding
; idle workers resident, and every resident worker is memory this box cannot
; spare. Workers spawn on demand and retire after 10 idle seconds.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s

; Recycle sooner than the dev pool's 500. Nothing here leaks, but a smaller
; number bounds the worst case if a dependency ever does.
pm.max_requests = 300

; Per-request ceiling. The heaviest page is the dashboard: five counts and one
; page of bookings - nowhere near this.
php_admin_value[memory_limit] = 128M

; The dev pool's slowlog attaches to a slow worker with ptrace(), which a
; container platform does not permit: at 0.1 CPU the first, cold request
; crosses the 10 s threshold and the log fills with
; "failed to ptrace(ATTACH) child: Operation not permitted". Off here.
request_slowlog_timeout = 0
