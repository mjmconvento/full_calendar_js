; Booking calendar — OPcache tuning for the prod image.
; The dev stage layers zzz-dev.ini on top and sets validate_timestamps=1.

[opcache]
opcache.enable = 1
; CLI (bin/console) is short-lived; caching there only costs memory.
opcache.enable_cli = 0

opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 10

; Immutable code in the prod image: never stat files again.
; The dev stage overrides this to 1 (plus revalidate_freq=0) so bind-mounted
; source changes are picked up without restarting php-fpm.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; Tracing JIT. Buffer is carved out of memory_consumption above.
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Symfony preloading.
; var/cache/prod/App_KernelProdContainer.preload.php only exists AFTER a prod
; cache warmup (the entrypoint runs cache:warmup before php-fpm starts), but the
; file is generated in a bind-mountable, per-env path — enabling it
; unconditionally makes php-fpm log a startup warning in dev/test, or whenever
; the container is started with a cold var/cache. Uncomment both lines once you
; are running a warmed prod image only:
;opcache.preload = /var/www/html/var/cache/prod/App_KernelProdContainer.preload.php
;opcache.preload_user = www-data
