; Two processes, one container - the shape a single-container PaaS instance
; requires. compose keeps nginx and php-fpm as separate services; this file is
; used only by the deployable `render` image stage.
;
; Everything logs to stdout/stderr so `render logs` / `docker logs` show both
; processes interleaved, and nothing needs a writable log directory.
;
; This is the whole config, not a snippet dropped into a conf.d: the packaged
; supervisord.conf declares a control socket nothing here uses.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; php-fpm first. nginx 502s for the moment before fpm is listening, which is why
; the platform health check goes through fpm (/healthz): the container is only
; reported healthy once both halves are actually up.
[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; `-e stderr` routes nginx's own startup log to stderr before it has read its
; config, so nothing is written under /var/lib/nginx.
command=nginx -e stderr -g "daemon off;"
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
