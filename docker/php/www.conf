; Booking calendar — php-fpm pool overrides.
; Installed as /usr/local/etc/php-fpm.d/zz-www.conf so it loads after the
; image's own www.conf and wins on every directive it redefines.

[www]
user = www-data
group = www-data

listen = 9000
listen.backlog = 511

; Container env (APP_ENV, APP_SECRET, DATABASE_URL, ...) must reach PHP.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.process_idle_timeout = 30s

; Monitoring / healthcheck endpoints (nginx exposes /fpm-ping to private nets).
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; All logging goes to the container's stdout/stderr.
access.log = /proc/self/fd/1
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"
catch_workers_output = yes
decorate_workers_output = no

slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
request_terminate_timeout = 60s

; Keep error output on stderr regardless of pool-level ini tinkering.
; (display_errors is left to the ini files so the dev stage can turn it on.)
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
