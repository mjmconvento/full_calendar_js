# Booking calendar — Symfony vhost (docroot public/, single front controller).
# Baked into the nginx image as /etc/nginx/conf.d/default.conf; in dev the whole
# conf.d directory is bind-mounted, which masks the baked copy (no duplicate
# server blocks), so edits here only need `make restart`.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 16m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # AssetMapper emits digest-hashed filenames, so compiled assets are
    # content-addressed and safe to cache forever. The fallback matters in dev,
    # where public/assets is not compiled and AssetMapper serves the files
    # through the front controller instead.
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.php$is_args$args;
    }

    # Never serve dotfiles (.env, .git, editor droppings) even if one lands in public/.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # php-fpm ping, for humans and monitoring; private networks only.
    location = /fpm-ping {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        access_log off;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_NAME     /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # Only reachable through the try_files rewrite above.
        internal;

        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    # Any other .php URI is a mistake or an attack, not a route.
    location ~ \.php$ {
        return 404;
    }
}
